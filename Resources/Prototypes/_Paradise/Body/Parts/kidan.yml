- type: entity
  id: PartKidan
  parent: [BaseItem, BasePart]
  name: "kidan body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 10
      - ReagentId: Fat
        Quantity: 10
      - reagentId : Blood
        Quantity: 10

- type: entity
  id: TorsoKidan
  name: "kidan torso"
  parent: [PartKidan, BaseTorso]
  components:
  - type: Sprite
    sprite: Mobs/Species/_Paradise/Kidan/parts.rsi
    state: "torso"
  - type: Icon
    sprite: Mobs/Species/_Paradise/Kidan/parts.rsi
    state: "torso"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 20
      - ReagentId: Fat
        Quantity: 20
      - reagentId : Blood
        Quantity: 40

